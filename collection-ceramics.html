<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limerence - Epoxy Collection</title>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@200;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --primary: #a30f59;
            --primary-light: rgba(163, 15, 89, 0.1);
            --neon: rgba(226, 7, 117, 0.8);
            --bg-light: #f3c1fa;
            --text-dark: #1a1a1a;
            --sidebar-width: 260px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
        }

        .app-layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            background: #f3c1fa;
            padding: 4rem 2rem;
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        .nav-list {
            list-style: none;
            margin-top: 2rem;
        }

        .nav-item {
            margin-bottom: 1.5rem;
        }

        .nav-link {
            text-decoration: none;
            color: #555;
            display: block;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: var(--transition);
        }

        .nav-link:hover {
            color: var(--primary);
            padding-left: 8px;
        }

        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
        }

        .page-header {
            position: relative;
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #000;
            border-radius: 0 0 0 20px;
        }

        .header-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.75;
            filter: brightness(1.2);
        }

        .header-title {
            position: relative;
            color: white;
            font-weight: 200;
            font-size: clamp(2rem, 5vw, 4.5rem);
            letter-spacing: 12px;
            text-transform: uppercase;
            text-shadow: 0 0 20px var(--neon);
            text-align: center;
        }

        .content-padding {
            padding: 4rem 5%;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2.5rem;
        }

        .card-name {
            font-weight: 400;
            font-size: 1rem;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }

        .card {
            background: rgb(242, 212, 248);
            border-radius: 12px;
            overflow: hidden;
            transition: var(--transition);
            border: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .card-img-wrapper {
            height: 320px;
            position: relative;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-fav-icon {
            position: absolute;
            top: 15px;
            right: 15px;
            background: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .card-body {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 5px;
        }

        .card-price {
            color: var(--primary);
            font-weight: 700;
            font-size: 1.25rem;
        }

        .card-basket-icon {
            color: var(--primary);
            font-size: 1.5rem;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .card-basket-icon:hover {
            transform: scale(1.2);
        }

        .card-meta {
            display: flex;
            gap: 5px;
            margin: 5px 0;
            flex-wrap: wrap;
        }

        .size-tag {
            border: 1px solid rgba(163, 15, 89, 0.3);
            padding: 2px 8px;
            font-size: 0.7rem;
            border-radius: 4px;
            color: var(--primary);
        }

        .card-status {
            font-size: 0.8rem;
            color: #d33eb0;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                padding: 2rem;
            }

            .main-content {
                margin-left: 0;
            }

            .page-header {
                height: 250px;
                border-radius: 0;
            }
        }
    </style>
</head>
