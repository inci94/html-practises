<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limerence - cleaning Product Collection</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary: #a30f59;
            --primary-light: rgba(163, 15, 89, 0.1);
            --neon: rgba(226, 7, 117, 0.8);
            --bg-light: #f7def4;
            --text-dark: #1a1a1a;
            --sidebar-width: 260px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
        }

        .app-layout {
            display: flex;
            min-height: 100vh;
        }

        .header-title {
            position: relative;
            color: white;
            font-weight: 200;
            font-size: clamp(2rem, 5vw, 4.5rem);
            letter-spacing: 12px;
            text-transform: uppercase;
            text-shadow: 0 0 20px var(--neon);
            text-align: center;
        }

        .content-padding {
            padding: 4rem 5%;
        }

        .grid {
            flex-direction: column;
        }

        <div class="checkout-container"><h2>Satın Alınacak Ürünler</h2>< !-- 1. Ürün Kutusu --><div class="checkout-item"><img src="urun-kutusu1.jpg" alt="Ürün Görseli" class="item-img"><div class="item-details"><span class="item-name">Limerence Özel Kutusu - Klasik</span><div class="item-controls"><span class="item-price">150 TL</span><div class="counter"><button class="btn-minus"><i class="bx bx-minus"></i></button><span class="quantity">1</span><button class="btn-plus"><i class="bx bx-plus"></i></button></div></div></div></div>< !-- 2. ve 3. Ürün Kutuları da benzer yapıda alt alta gelecek --></div>
